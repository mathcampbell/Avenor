name: v13 drainage evolution
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s=p.read_text()
          marker='static int32 PrimaryReceiver(const FAvenorStripData& Data, int32 Cell)\n{'
          if 'static void EvolveTerrainFromDrainage(' not in s:
              if marker not in s: raise RuntimeError('receiver marker missing')
              evo=base64.b64decode('').decode()
              s=s.replace(marker,evo+marker,1)
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if old not in s: raise RuntimeError('generation insertion point missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git commit -m "Evolve terrain through drainage and differential erosion"
          git push
