name: Apply structural terrain rewrite

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite terrain generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hpath = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.h')
          cpppath = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          h = hpath.read_text(encoding='utf-8')
          cpp = cpppath.read_text(encoding='utf-8')

          def sub1(text, pattern, replacement, name, flags=re.S):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{name}: expected one match, found {count}')
              print('patched:', name)
              return out

          # Replace the old mountain/hill placement controls with four structural controls.
          landforms = r'''/** Broad controls for the continuous structural terrain field. */
          USTRUCT(BlueprintType)
          struct FAvenorLandformSettings
          {
              GENERATED_BODY()

              UPROPERTY(EditAnywhere, Category = "Landforms", meta = (Units = "cm", ClampMin = "25000.0", ClampMax = "600000.0", ToolTip = "Overall vertical relief available to the structural terrain system. Mountains, uplands, basins and rifts all emerge from this same field."))
              double ReliefHeight = 300000.0;

              UPROPERTY(EditAnywhere, Category = "Landforms", meta = (Units = "cm", ClampMin = "250000.0", ClampMax = "5000000.0", ToolTip = "Typical scale of major ridges, uplands, basins and rift structures. This is not a mountain size control."))
              double StructuralScale = 1600000.0;

              UPROPERTY(EditAnywhere, Category = "Landforms", meta = (ClampMin = "0.0", ClampMax = "1.0", ToolTip = "Controls how strongly broad uplift and compression become rugged high-relief terrain. Lower values favour older rolling terrain; higher values favour active rugged relief."))
              double TectonicActivity = 0.65;

              UPROPERTY(EditAnywhere, Category = "Landforms", meta = (ClampMin = "0.0", ClampMax = "1.0", ToolTip = "Strength of elongated subsidence and extension structures. These become rift valleys, fault-bounded basins and major lowland corridors."))
              double RiftStrength = 0.45;
          };

          /**
           * Low-frequency climate controls.'''
          h = sub1(
              h,
              r'/\*\* The few broad landform decisions that should be art-directed\. \*/\s*USTRUCT\(BlueprintType\)\s*struct FAvenorLandformSettings\s*\{.*?\n\};\n\n/\*\*\n \* Low-frequency climate controls\.',
              landforms,
              'landform settings'
          )

          # Hide genuinely technical settings from the normal Details panel.
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Climate", meta = (Units = "cm", ClampMin = "100000.0", ToolTip = "Spacing of the smooth climate control points and length of each exported PCG source tile. Five kilometres is the recommended default."))',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Climate", meta = (Units = "cm", ClampMin = "100000.0", ToolTip = "Spacing of the smooth climate control points and length of each exported PCG source tile. Five kilometres is the recommended default."))'
          )
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Climate", meta = (Units = "cm", ClampMin = "10000.0", ToolTip = "Distance over which rivers and lakes increase local habitat moisture."))',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Climate", meta = (Units = "cm", ClampMin = "10000.0", ToolTip = "Distance over which rivers and lakes increase local habitat moisture."))'
          )
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Climate", meta = (ClampMin = "0.0", ClampMax = "1.0"))\n    double WaterMoistureBoost',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Climate", meta = (ClampMin = "0.0", ClampMax = "1.0"))\n    double WaterMoistureBoost'
          )
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Water Terrain", meta = (Units = "cm", ClampMin = "0.0", ClampMax = "10000.0", ToolTip = "Generator-wide dry margin between rendered water and the start of the broad terrain ramp. Applied to every generated river and lake modifier."))',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Water Terrain", meta = (Units = "cm", ClampMin = "0.0", ClampMax = "10000.0", ToolTip = "Generator-wide dry margin between rendered water and the start of the broad terrain ramp. Applied to every generated river and lake modifier."))'
          )
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Water Terrain", meta = (ClampMin = "0", ClampMax = "16", ToolTip = "Native Water Body heightmap blur radius. Small values soften triangulation without washing out the bank."))',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Water Terrain", meta = (ClampMin = "0", ClampMax = "16", ToolTip = "Native Water Body heightmap blur radius. Small values soften triangulation without washing out the bank."))'
          )
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Water Terrain", meta = (ClampMin = "0.0", ClampMax = "1.0", ToolTip = "Adds restrained native curl noise to shore and bank edges."))',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Water Terrain", meta = (ClampMin = "0.0", ClampMax = "1.0", ToolTip = "Adds restrained native curl noise to shore and bank edges."))'
          )

          # Weight-channel names are implementation constants, not art controls.
          h = re.sub(r'\n    UPROPERTY\(EditAnywhere, Category = "Water Terrain\|Weight Channels"\)\n    FName RiverBedWeight', '\n    FName RiverBedWeight', h)
          h = re.sub(r'\n    UPROPERTY\(EditAnywhere, Category = "Water Terrain\|Weight Channels"\)\n    FName RiverBankWeight', '\n    FName RiverBankWeight', h)
          h = re.sub(r'\n    UPROPERTY\(EditAnywhere, Category = "Water Terrain\|Weight Channels"\)\n    FName LakeBedWeight', '\n    FName LakeBedWeight', h)
          h = re.sub(r'\n    UPROPERTY\(EditAnywhere, Category = "Water Terrain\|Weight Channels"\)\n    FName LakeShoreWeight', '\n    FName LakeShoreWeight', h)

          # Chunk size is an implementation detail for now.
          h = re.sub(
              r'\n    UPROPERTY\(EditAnywhere, Category = "Avenor\|Baked Data", meta = \(ClampMin = "16", ClampMax = "512", ToolTip = "Raster cells per independently compressed chunk\. Async per-chunk loading can use this boundary later\."\)\)\n    int32 BakedChunkCellSize',
              '\n    int32 BakedChunkCellSize',
              h,
              count=1
          )

          # Refinement remains available but lives under Advanced rather than occupying the normal panel.
          h = h.replace(
              'UPROPERTY(EditAnywhere, Category = "Avenor|Refinement", meta = (ShowOnlyInnerProperties))\n    FAvenorTerrainRefinementSettings Refinement;',
              'UPROPERTY(EditAnywhere, AdvancedDisplay, Category = "Avenor|Refinement", meta = (ShowOnlyInnerProperties))\n    FAvenorTerrainRefinementSettings Refinement;'
          )

          # Replace obsolete internal mountain placement parameters.
          h = sub1(
              h,
              r'    double ZoneLength = 2500000\.0;.*?    double HillsScale = 220000\.0;\n',
              '''    double StructuralRelief = 300000.0;\n    double StructuralScale = 1600000.0;\n    double TectonicActivity = 0.65;\n    double RiftStrength = 0.45;\n''',
              'internal structural fields'
          )

          # Legacy FMountainRange no longer has any role in generation.
          cpp = sub1(
              cpp,
              r'struct FMountainRange\s*\{.*?\n\};\n\n',
              '',
              'remove FMountainRange'
          )

          # New continuous structural terrain model. No mountain objects are placed.
          structural_code = r'''namespace UE::Avenor::Strip
          {
          static double EvaluateLandform(
              const FVector2D& Position,
              const FBox& Bounds,
              int32 Seed,
              EAvenorStripLongAxis LongAxis,
              double ReliefHeight,
              double StructuralScale,
              double TectonicActivity,
              double RiftStrength,
              bool bClimateEnabled,
              double ClimateTemperature,
              double ClimateMoisture,
              double& OutResistance,
              double& OutMountainMask,
              double& OutHillMask,
              double& OutDesertMask,
              double& OutPlainsMask
          )
          {
              (void)Bounds;
              const double Relief = FMath::Max(25000.0, ReliefHeight);
              const double Scale = FMath::Max(250000.0, StructuralScale);
              const double Activity = FMath::Clamp(TectonicActivity, 0.0, 1.0);
              const double RiftAmount = FMath::Clamp(RiftStrength, 0.0, 1.0);

              const FVector2D SeedOffset(
                  static_cast<double>((Seed * 92821) & 0x7ffff),
                  static_cast<double>((Seed * 68917) & 0x7ffff)
              );

              // Large, smoothly varying distortion keeps structural lines from
              // looking like analytic bands while preserving kilometre-scale continuity.
              const FVector2D MacroWarp(
                  Fbm(Position, Scale * 1.75, SeedOffset + FVector2D(137.0, 911.0), 4, 0.56, 2.0),
                  Fbm(Position, Scale * 1.75, SeedOffset + FVector2D(733.0, 271.0), 4, 0.56, 2.0)
              );
              const FVector2D Warped = Position + MacroWarp * Scale * 0.38;

              const FVector2D StripAxis = LongAxis == EAvenorStripLongAxis::X
                  ? FVector2D(1.0, 0.0) : FVector2D(0.0, 1.0);
              const FVector2D StripAcross = Rotate90(StripAxis);
              const double SeedAngleA = FMath::Fmod(
                  FMath::Abs(static_cast<double>(Seed)) * 0.000913 + 0.37, PI
              );
              const double SeedAngleB = FMath::Fmod(SeedAngleA + 1.047 +
                  FMath::Abs(static_cast<double>(Seed)) * 0.000217, PI);
              const FVector2D AxisA(
                  FMath::Cos(SeedAngleA), FMath::Sin(SeedAngleA)
              );
              const FVector2D AxisB(
                  FMath::Cos(SeedAngleB), FMath::Sin(SeedAngleB)
              );
              const FVector2D AcrossA = Rotate90(AxisA);
              const FVector2D AcrossB = Rotate90(AxisB);

              auto Oriented = [](const FVector2D& P, const FVector2D& Along,
                                 const FVector2D& Across, double AlongStretch,
                                 double AcrossStretch)
              {
                  return FVector2D(
                      FVector2D::DotProduct(P, Along) / AlongStretch,
                      FVector2D::DotProduct(P, Across) / AcrossStretch
                  );
              };

              // The plate field is authoritative: positive regions uplift,
              // negative regions subside. It exists everywhere, so plains are
              // not merely the empty space between explicitly placed mountains.
              const double PlateField = Fbm(
                  Warped,
                  Scale * 2.15,
                  SeedOffset + FVector2D(1201.0, 331.0),
                  5, 0.57, 2.0
              );
              const double RegionalTilt = Fbm(
                  Oriented(Warped, StripAxis, StripAcross, 2.4, 0.85),
                  Scale * 2.8,
                  SeedOffset + FVector2D(149.0, 1267.0),
                  4, 0.55, 2.0
              );
              const double Uplift = FMath::Clamp(
                  PlateField * 0.72 + RegionalTilt * 0.28,
                  -1.0, 1.0
              );
              const double PositiveUplift = Smooth01(FMath::Clamp(
                  (Uplift + 0.08) / 0.88, 0.0, 1.0
              ));
              const double Subsidence = Smooth01(FMath::Clamp(
                  (-Uplift + 0.06) / 0.82, 0.0, 1.0
              ));

              // Two differently oriented compression systems generate belts,
              // branching ridges, saddles and uplands without spawning a
              // separate mountain primitive.
              const double CompressionA = RidgedFbm(
                  Oriented(Warped, AxisA, AcrossA, 2.6, 0.72),
                  Scale * 0.72,
                  SeedOffset + FVector2D(421.0, 719.0),
                  6
              );
              const double CompressionB = RidgedFbm(
                  Oriented(Warped, AxisB, AcrossB, 2.0, 0.80),
                  Scale * 0.92,
                  SeedOffset + FVector2D(877.0, 149.0),
                  5
              );
              const double Compression = FMath::Clamp(
                  CompressionA * 0.64 + CompressionB * 0.36,
                  0.0, 1.0
              );
              const double CompressionSupport =
                  Compression * FMath::Lerp(0.35, 1.0, PositiveUplift);
              OutMountainMask = Smooth01(FMath::Clamp(
                  (CompressionSupport - FMath::Lerp(0.62, 0.43, Activity))
                      / 0.34,
                  0.0, 1.0
              ));

              // Extension/subsidence creates elongated rifts and fault-bounded
              // valleys. A second low-frequency field prevents every rift from
              // crossing the entire world as one uninterrupted groove.
              const double RiftRidge = RidgedFbm(
                  Oriented(
                      Warped + FVector2D(
                          Fbm(Warped, Scale, SeedOffset + FVector2D(509.0, 193.0), 3) * Scale * 0.25,
                          Fbm(Warped, Scale, SeedOffset + FVector2D(827.0, 557.0), 3) * Scale * 0.25
                      ),
                      AxisB, AcrossB, 3.1, 0.58
                  ),
                  Scale * 0.58,
                  SeedOffset + FVector2D(919.0, 1601.0),
                  5
              );
              const double RiftContinuity = 0.5 + 0.5 * Fbm(
                  Warped,
                  Scale * 1.9,
                  SeedOffset + FVector2D(1733.0, 449.0),
                  3, 0.58, 2.0
              );
              const double RiftMask = Smooth01(FMath::Clamp(
                  (RiftRidge * FMath::Lerp(0.55, 1.0, Subsidence)
                      * FMath::Lerp(0.45, 1.0, RiftContinuity) - 0.48)
                      / 0.38,
                  0.0, 1.0
              )) * RiftAmount * (1.0 - OutMountainMask * 0.72);

              const double BasinNoise = 0.5 + 0.5 * Fbm(
                  Warped,
                  Scale * 1.25,
                  SeedOffset + FVector2D(1543.0, 271.0),
                  4, 0.56, 2.0
              );
              const double BasinMask = Subsidence
                  * Smooth01(FMath::Clamp((BasinNoise - 0.38) / 0.48, 0.0, 1.0))
                  * (1.0 - RiftMask * 0.45);

              const double RidgeDetail = RidgedFbm(
                  Warped,
                  Scale * 0.24,
                  SeedOffset + FVector2D(947.0, 271.0),
                  5
              );
              const double RollingField = Fbm(
                  Warped,
                  Scale * 0.42,
                  SeedOffset + FVector2D(887.0, 157.0),
                  5, 0.54, 2.03
              );
              OutHillMask = Smooth01(FMath::Clamp(
                  (0.48 * RidgeDetail
                      + 0.34 * FMath::Abs(Uplift)
                      + 0.18 * FMath::Abs(RollingField) - 0.26) / 0.46,
                  0.0, 1.0
              )) * (1.0 - OutMountainMask * 0.82)
                 * (1.0 - RiftMask * 0.55);

              OutPlainsMask = FMath::Clamp(
                  1.0 - OutMountainMask * 0.94
                      - OutHillMask * 0.58
                      - RiftMask * 0.42,
                  0.0, 1.0
              );

              double Height =
                  Uplift * Relief * 0.28
                  + RegionalTilt * Relief * 0.10;

              // High relief is an emergent extreme of the same compression
              // field that produces ordinary ridges and uplands.
              Height += FMath::Pow(OutMountainMask, 1.35)
                  * Relief * FMath::Lerp(0.62, 1.18, Activity)
                  * FMath::Lerp(0.72, 1.10, RidgeDetail);

              // Moderate structure becomes rolling hills, shoulders and
              // dissected uplands instead of featureless non-mountain space.
              Height += OutHillMask * Relief * 0.18
                  * (RollingField * 0.62 + (RidgeDetail - 0.43) * 0.38);

              // Negative structure has equal authority: rifts and basins are
              // genuine landforms rather than places where a mountain was not placed.
              Height -= RiftMask * Relief * FMath::Lerp(0.16, 0.50, RiftAmount)
                  * FMath::Lerp(0.78, 1.08, RiftRidge);
              Height -= BasinMask * Relief * 0.16;

              // Lowlands retain broad rolls and drainage divides, but at much
              // lower amplitude than active relief.
              const double LowlandRoll = Fbm(
                  Warped,
                  Scale * 0.78,
                  SeedOffset + FVector2D(101.0, 43.0),
                  4, 0.56, 2.0
              );
              const double LowlandRidges = RidgedFbm(
                  Warped,
                  Scale * 0.50,
                  SeedOffset + FVector2D(607.0, 1489.0),
                  4
              );
              Height += OutPlainsMask * Relief * (
                  LowlandRoll * 0.065
                  + (LowlandRidges - 0.43) * 0.035
              );

              const double Warmth = bClimateEnabled
                  ? Smooth01(FMath::Clamp(
                      (ClimateTemperature - 0.28) / 0.58, 0.0, 1.0
                  )) : 0.0;
              const double Dryness = bClimateEnabled
                  ? Smooth01(FMath::Clamp(
                      (0.58 - ClimateMoisture) / 0.48, 0.0, 1.0
                  )) : 0.0;
              const double Aridity = Warmth * Dryness;
              OutDesertMask = Aridity * FMath::Clamp(
                  1.0 - OutMountainMask * 0.42,
                  0.0, 1.0
              );

              // Climate modifies the expression of existing structure. It does
              // not create a separate desert terrain system.
              const double PlateauSignal = 0.5 + 0.5 * Fbm(
                  Warped,
                  Scale * 0.38,
                  SeedOffset + FVector2D(811.0, 397.0),
                  4, 0.55, 2.0
              );
              const double PlateauMask = Smooth01(FMath::Clamp(
                  (PlateauSignal - 0.50) / 0.26, 0.0, 1.0
              )) * OutDesertMask * FMath::Lerp(0.35, 1.0, OutHillMask);
              Height += PlateauMask * Relief * 0.10;

              const double BadlandRidges = RidgedFbm(
                  Warped,
                  FMath::Max(70000.0, Scale * 0.075),
                  SeedOffset + FVector2D(1733.0, 1449.0),
                  5
              );
              Height += (BadlandRidges - 0.46) * Relief * 0.035
                  * PlateauMask;

              // Generator-scale dunes only occur on structurally quiet arid
              // plains. Fine ripples remain a material concern.
              const double DuneSuitability = OutDesertMask
                  * OutPlainsMask
                  * (1.0 - PlateauMask * 0.85)
                  * (1.0 - RiftMask * 0.65);
              if (DuneSuitability > 0.03)
              {
                  const double WindAngle = FMath::Fmod(
                      FMath::Abs(static_cast<double>(Seed)) * 0.000731 + 0.83,
                      PI
                  );
                  const FVector2D WindDirection(
                      FMath::Cos(WindAngle), FMath::Sin(WindAngle)
                  );
                  const double DuneWavelength = FMath::Clamp(
                      Scale * 0.055, 45000.0, 140000.0
                  );
                  const double PhaseWarp = Fbm(
                      Warped,
                      DuneWavelength * 5.2,
                      SeedOffset + FVector2D(1877.0, 1021.0),
                      3, 0.55, 2.0
                  ) * DuneWavelength * 0.85;
                  const double WindCoordinate =
                      FVector2D::DotProduct(Warped, WindDirection) + PhaseWarp;
                  const double DuneWave = 0.5 + 0.5 * FMath::Sin(
                      2.0 * PI * WindCoordinate / DuneWavelength
                  );
                  Height += (FMath::Pow(DuneWave, 2.25) - 0.31)
                      * Relief * 0.025 * DuneSuitability;
              }

              // Resistance is geological/climatic rather than a "desert only"
              // switch. This allows humid resistant uplands to form gorges too.
              OutResistance = FMath::Clamp(
                  OutMountainMask * 0.34
                      + OutHillMask * 0.12
                      + OutDesertMask * (0.24 + PlateauMask * 0.34)
                      + (1.0 - BasinMask) * RidgeDetail * 0.08,
                  0.0, 1.0
              );
              return Height;
          }
          } // namespace UE::Avenor::Strip

          using namespace UE::Avenor::Strip;'''

          cpp = sub1(
              cpp,
              r'namespace UE::Avenor::Strip\n\{\nstatic TArray<FMountainRange> BuildMountainRanges\(.*?\n\} // namespace UE::Avenor::Strip\n\nnamespace UE::Avenor::Strip\n\{\nstatic double EvaluateLandform\(.*?\n\}\n\} // namespace UE::Avenor::Strip\n\nusing namespace UE::Avenor::Strip;',
              structural_code,
              'continuous structural terrain'
          )

          # The geography pass no longer builds or places mountain objects.
          cpp = sub1(
              cpp,
              r'\n    TArray<FMountainRange> Mountains;\n    if \(Generator\.bGenerateMountains\)\n    \{.*?\n    \}\n    Data->PlacedMountainRanges = Mountains\.Num\(\);\n',
              '''\n    // Major relief now emerges from one continuous structural field.\n    Data->RequestedMountainRanges = 0;\n    Data->PlacedMountainRanges = 0;\n''',
              'remove mountain placement pass'
          )

          cpp = sub1(
              cpp,
              r'Data->Height\[Cell\] = EvaluateLandform\(\n.*?\n        \);',
              '''Data->Height[Cell] = EvaluateLandform(\n            Data->CellPosition(Cell), Bounds, Generator.Seed, Generator.LongAxis,\n            Generator.StructuralRelief, Generator.StructuralScale,\n            Generator.TectonicActivity, Generator.RiftStrength,\n            Generator.bGenerateClimate,\n            Data->Temperature[Cell], Data->Moisture[Cell],\n            CellResistance,\n            CellMountainMask, CellHillMask, CellDesertMask, CellPlainsMask\n        );''',
              'landform evaluation call'
          )

          # Resolve only the new four art-direction settings.
          cpp = sub1(
              cpp,
              r'    AnalysisCellSize = Erosion\.AnalysisSpacing;\n    bGenerateMountains = Landforms\.bMountains;.*?    HillsScale = Landforms\.HillSize;\n',
              '''    AnalysisCellSize = Erosion.AnalysisSpacing;\n    StructuralRelief = FMath::Max(25000.0, Landforms.ReliefHeight);\n    StructuralScale = FMath::Max(250000.0, Landforms.StructuralScale);\n    TectonicActivity = FMath::Clamp(Landforms.TectonicActivity, 0.0, 1.0);\n    RiftStrength = FMath::Clamp(Landforms.RiftStrength, 0.0, 1.0);\n    bGenerateMesasAndCanyons = true;\n    MesaScale = FMath::Clamp(StructuralScale * 0.24, 150000.0, 800000.0);\n''',
              'resolve structural settings'
          )

          # Settings hashes now describe the structural model, not obsolete mountain counts.
          snapshot = r'''FString AAvenorStripTerrainGenerator::BuildSettingsSnapshot() const
          {
              return FString::Printf(
                  TEXT("v%d|seed=%d|size=%.17g,%.17g|axis=%d|")
                  TEXT("land=%.17g,%.17g,%.17g,%.17g|")
                  TEXT("climate=%d,%.17g,%.17g,%.17g,%.17g,%.17g,%.17g,%d|")
                  TEXT("erosion=%.17g,%d,%.17g|hydrology=%d,%.17g,%.17g,%d,%d,%.17g|")
                  TEXT("water=%.17g,%.17g,%.17g,%.17g,%.17g,%.17g,%.17g,%d,%.17g,%s,%s,%s,%s"),
                  UE::Avenor::Strip::BakedData::GeneratorAlgorithmVersion,
                  Seed, WorldSize.X, WorldSize.Y, static_cast<int32>(LongAxis),
                  Landforms.ReliefHeight, Landforms.StructuralScale,
                  Landforms.TectonicActivity, Landforms.RiftStrength,
                  Climate.bEnabled, Climate.Temperature, Climate.Moisture,
                  Climate.RegionalVariation, Climate.RegionSpacing,
                  Climate.WaterInfluenceDistance, Climate.WaterMoistureBoost,
                  Climate.bShowcaseClimateCompression,
                  Erosion.Strength, Erosion.Passes, Erosion.AnalysisSpacing,
                  Hydrology.bRivers, Hydrology.RiverDensity, Hydrology.MinimumRiverLength,
                  Hydrology.bLakes, Hydrology.MaximumLakes, Hydrology.MinimumLakeDepression,
                  WaterTerrain.RiverWidthScale, WaterTerrain.RiverDepthScale,
                  WaterTerrain.RiverBankWidth, WaterTerrain.LakeBedDepth,
                  WaterTerrain.LakeShoreWidth, WaterTerrain.LakeSurfaceInset,
                  WaterTerrain.DryBankWidth, WaterTerrain.BlurRadius,
                  WaterTerrain.EdgeRoughness,
                  *WaterTerrain.RiverBedWeight.ToString(),
                  *WaterTerrain.RiverBankWeight.ToString(),
                  *WaterTerrain.LakeBedWeight.ToString(),
                  *WaterTerrain.LakeShoreWeight.ToString()
              );
          }

          FString AAvenorStripTerrainGenerator::BuildSettingsHash() const'''
          cpp = sub1(
              cpp,
              r'FString AAvenorStripTerrainGenerator::BuildSettingsSnapshot\(\) const\n\{.*?\n\}\n\nFString AAvenorStripTerrainGenerator::BuildSettingsHash\(\) const',
              snapshot,
              'settings snapshot'
          )

          # New data is not compatible with prior baked terrain/DDC.
          cpp = sub1(
              cpp,
              r'static constexpr int32 GeneratorAlgorithmVersion = 8;',
              'static constexpr int32 GeneratorAlgorithmVersion = 9;',
              'algorithm version',
              flags=0
          )
          cpp = sub1(
              cpp,
              r'static FGuid Version\(\) \{ return FGuid\(TEXT\("3b6044af-2fc4-4b2e-bc19-83c52493bda8"\)\); \}',
              'static FGuid Version() { return FGuid(TEXT("891c782d-e654-45d7-889c-c5d1cfe75be2")); }',
              'mesh partition code version',
              flags=0
          )

          # Status text should no longer imply that mountain objects were placed.
          cpp = cpp.replace(
              '| mountains %d/%d | river seeds %d + %d downstream cells = %d channel cells |',
              '| structural relief %.0fcm @ %.0fcm scale | river seeds %d + %d downstream cells = %d channel cells |'
          )
          cpp = cpp.replace(
              'Data->PlacedMountainRanges, Data->RequestedMountainRanges,\n        Data->RiverSeedCells,',
              'StructuralRelief, StructuralScale,\n        Data->RiverSeedCells,'
          )

          hpath.write_text(h, encoding='utf-8', newline='\n')
          cpppath.write_text(cpp, encoding='utf-8', newline='\n')
          PY

      - name: Commit rewrite
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.h AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
