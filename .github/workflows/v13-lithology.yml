name: v13 lithology
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s=p.read_text()
          start=s.find('    // Arid climate exposes and flattens resistant uplands into mesas and')
          end=s.find('    // Dunes remain low-amplitude regional terrain on quiet arid plains.',start)
          if start < 0 or end < 0: raise RuntimeError('mesa markers missing')
          block=base64.b64decode('').decode()
          s=s[:start]+block+s[end:]
          s=s.replace('(1.0 - PlateauMask * 0.90)','(1.0 - ResistantCap * 0.85)',1)
          s=s.replace('OutMountainMask * 0.28','OutMountainMask * 0.24',1)
          s=s.replace('+ OutHillMask * 0.11','+ OutHillMask * 0.09',1)
          s=s.replace('+ OutDesertMask * (0.18 + PlateauMask * 0.38)','+ OutDesertMask * 0.10\n            + ResistantCap * 0.62',1)
          if 'PlateauMask' in s[start:end+1000]: raise RuntimeError('stale plateau reference')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git commit -m "Replace stamped mesas with resistant lithology"
          git push
