name: One-shot terrain v15 issue runner
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.issue.title == 'RUN TERRAIN V15 CLIMATE PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run embedded v15 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/terrain-v15-climate-debug.yml').read_text()
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n\n          git config"
          start = workflow.index(start_token) + len(start_token)
          end = workflow.index(end_token, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/terrain_v15_patch.py').write_text(script)
          PY
          python3 /tmp/terrain_v15_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp \
                  AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.h \
                  AvenorClient/Source/Avenor/AvenorTerrainData.h \
                  AvenorClient/Source/Avenor/AvenorTerrainData.cpp
          git commit -m "Add broad climate provinces and editor biome probe"
          git push
