name: Run terrain v14 patch from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN TERRAIN V14 PATCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute stored patch script
        shell: bash
        run: |
          awk '/python3 - <<'"'"'PY'"'"'/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/terrain-v14-rivers-probe.yml > /tmp/terrain_v14.py
          python3 /tmp/terrain_v14.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp \
                  AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.h \
                  AvenorClient/Source/AvenorEditor/AvenorBiomeCameraProbe.cpp
          git commit -m "Keep rivers on thalwegs and diversify terrain relief"
          git push
