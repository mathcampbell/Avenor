name: Minimal terrain v13 patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s=p.read_text()
          s=s.replace('static constexpr int32 GeneratorAlgorithmVersion = 12;', 'static constexpr int32 GeneratorAlgorithmVersion = 13;', 1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git commit -m "Start terrain v13 evolution"
          git push
