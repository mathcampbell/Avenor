name: Apply terrain v17 final source patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'RUN TERRAIN V17 FINAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Edit terrain source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gen = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s = gen.read_text(encoding='utf-8')
          s = s.replace('static constexpr int32 GeneratorAlgorithmVersion = 16;', 'static constexpr int32 GeneratorAlgorithmVersion = 17;')

          start = s.find('static void ReclassifyFinalLandforms(FAvenorStripData& Data)')
          end = s.find('\nstatic void RefineClimateFromHydrology(', start)
          if start < 0 or end < 0:
              raise RuntimeError('Could not locate final landform classifier')
          classifier = r'''static void ReclassifyFinalLandforms(FAvenorStripData& Data)
{
    const int32 CellCount = Data.Columns * Data.Rows;
    if (CellCount <= 0)
    {
        return;
    }

    TArray<double> NewMountain;
    TArray<double> NewHill;
    TArray<double> NewPlains;
    NewMountain.SetNumUninitialized(CellCount);
    NewHill.SetNumUninitialized(CellCount);
    NewPlains.SetNumUninitialized(CellCount);

    // Classify the surface that actually survives erosion. Structural masks
    // are useful evidence, but final relief/prominence is authoritative.
    const double NearRadius = FMath::Max(60000.0, Data.CellSize * 12.0);
    const double FarRadius = FMath::Max(180000.0, Data.CellSize * 36.0);
    static const FVector2D Directions[] = {
        FVector2D(1,0), FVector2D(-1,0), FVector2D(0,1), FVector2D(0,-1),
        FVector2D(0.70710678,0.70710678), FVector2D(-0.70710678,0.70710678),
        FVector2D(0.70710678,-0.70710678), FVector2D(-0.70710678,-0.70710678)
    };

    for (int32 Cell = 0; Cell < CellCount; ++Cell)
    {
        const FVector2D Position = Data.CellPosition(Cell);
        const double Height = Data.Height[Cell];
        double NearMin = Height;
        double NearMax = Height;
        double FarMin = Height;
        double FarMax = Height;
        for (const FVector2D& Direction : Directions)
        {
            const double NearHeight = Data.SampleGrid(Data.Height, Position + Direction * NearRadius);
            const double FarHeight = Data.SampleGrid(Data.Height, Position + Direction * FarRadius);
            NearMin = FMath::Min(NearMin, NearHeight);
            NearMax = FMath::Max(NearMax, NearHeight);
            FarMin = FMath::Min(FarMin, FarHeight);
            FarMax = FMath::Max(FarMax, FarHeight);
        }

        const double NearRelief = FMath::Max(0.0, NearMax - NearMin);
        const double FarRelief = FMath::Max(0.0, FarMax - FarMin);
        const double NearProminence = FMath::Max(0.0, Height - NearMin);
        const double FarProminence = FMath::Max(0.0, Height - FarMin);
        const double ElevationMetres = FMath::Max(0.0, Height) / 100.0;
        const double Slope = FMath::Max(0.0, Data.Slope[Cell]);

        const double NearReliefFactor = Smooth01(FMath::Clamp((NearRelief - 12000.0) / 52000.0, 0.0, 1.0));
        const double FarReliefFactor = Smooth01(FMath::Clamp((FarRelief - 28000.0) / 90000.0, 0.0, 1.0));
        const double ProminenceFactor = Smooth01(FMath::Clamp(
            (FMath::Max(NearProminence, FarProminence * 0.72) - 12000.0) / 65000.0,
            0.0, 1.0));
        const double ElevationFactor = Smooth01(FMath::Clamp((ElevationMetres - 450.0) / 900.0, 0.0, 1.0));
        const double SlopeFactor = Smooth01(FMath::Clamp((Slope - 0.012) / 0.075, 0.0, 1.0));
        const double StructuralMountain = FMath::Clamp(Data.MountainMask[Cell], 0.0, 1.0);
        const double StructuralHill = FMath::Clamp(Data.HillMask[Cell], 0.0, 1.0);

        const double GeometricMountain = FMath::Clamp(
            ProminenceFactor
                * FMath::Lerp(NearReliefFactor, FarReliefFactor, 0.62)
                * FMath::Lerp(0.72, 1.0, FMath::Max(ElevationFactor, SlopeFactor)),
            0.0, 1.0);
        const double HighMassifSupport = ElevationFactor
            * FMath::Max(FarReliefFactor, SlopeFactor * 0.72);
        const double Mountain = FMath::Clamp(FMath::Max(
            FMath::Max(
                StructuralMountain * FMath::Lerp(0.48, 1.0, FarReliefFactor),
                GeometricMountain),
            HighMassifSupport * 0.88), 0.0, 1.0);

        const double HillRelief = Smooth01(FMath::Clamp((NearRelief - 5000.0) / 36000.0, 0.0, 1.0));
        const double HillProminence = Smooth01(FMath::Clamp((NearProminence - 3500.0) / 30000.0, 0.0, 1.0));
        const double UplandElevation = Smooth01(FMath::Clamp((ElevationMetres - 250.0) / 600.0, 0.0, 1.0));
        const double GeometricHill = FMath::Clamp(FMath::Max(
            HillRelief * FMath::Max(HillProminence, SlopeFactor * 0.75),
            UplandElevation * FMath::Max(HillRelief, SlopeFactor) * 0.78), 0.0, 1.0);
        const double Hill = FMath::Clamp(FMath::Max(
            StructuralHill * FMath::Lerp(0.45, 0.86, HillRelief),
            GeometricHill) * (1.0 - Mountain * 0.72), 0.0, 1.0);

        NewMountain[Cell] = Mountain;
        NewHill[Cell] = Hill;
        NewPlains[Cell] = FMath::Clamp(1.0 - Mountain * 1.05 - Hill * 0.88, 0.0, 1.0);
    }

    Data.MountainMask = MoveTemp(NewMountain);
    Data.HillMask = MoveTemp(NewHill);
    Data.PlainsMask = MoveTemp(NewPlains);
}
'''
          s = s[:start] + classifier + s[end:]

          s = s.replace('ElevationMetres / 3000.0, 0.0, 1.5', 'ElevationMetres / 2400.0, 0.0, 1.65')
          s = s.replace('RegionalTemperature - ElevationFraction * 0.46\n                - MountainExposure * ElevationFraction * 0.05',
                        'RegionalTemperature - ElevationFraction * 0.52\n                - MountainExposure * ElevationFraction * 0.07')
          s = s.replace('RegionalMoisture\n                - ElevationFraction * 0.11\n                - MountainExposure * 0.035',
                        'RegionalMoisture\n                - ElevationFraction * 0.16\n                - MountainExposure * 0.055')

          alpine_pattern = re.compile(r'''        const bool bHighTerrain = FinalMountain > 0\.28 \|\| ElevationMetres > 1400\.0;\n        if \(Temperature < 0\.105 && bHighTerrain\)\n        \{\n            Biome = EAvenorBiomeClass::SnowIce;\n        \}\n        else if \(Temperature < 0\.32 && bHighTerrain\)\n        \{\n            Biome = EAvenorBiomeClass::AlpineTundra;\n        \}''')
          alpine = '''        const double FinalHill = FMath::Clamp(Data.HillMask[Cell], 0.0, 1.0);\n        // Mountain is a landform; alpine is a climate outcome. Elevation and\n        // final temperature decide the latter, with mountain/upland geometry\n        // only influencing where the transition becomes plausible.\n        const bool bMountainTerrain = FinalMountain > 0.34;\n        const bool bHighUpland = FinalHill > 0.32 && ElevationMetres > 850.0;\n        const bool bVeryHighTerrain = ElevationMetres > 1450.0;\n        const bool bAlpineCandidate = bVeryHighTerrain\n            || (bMountainTerrain && ElevationMetres > 850.0)\n            || (bHighUpland && ElevationMetres > 1050.0);\n        if (Temperature < 0.10\n            && (bVeryHighTerrain || (bMountainTerrain && ElevationMetres > 1200.0)))\n        {\n            Biome = EAvenorBiomeClass::SnowIce;\n        }\n        else if (Temperature < 0.29 && bAlpineCandidate)\n        {\n            Biome = EAvenorBiomeClass::AlpineTundra;\n        }'''
          s, count = alpine_pattern.subn(alpine, s, count=1)
          if count != 1:
              raise RuntimeError('Could not replace alpine classification')

          s = s.replace('849c98b2-52c1-48dd-9431-9864e17fc8ae', 'db3d6d52-772c-4d64-9e37-1838c3738771')
          gen.write_text(s, encoding='utf-8')

          terrain = Path('AvenorClient/Source/Avenor/AvenorTerrainData.cpp')
          t = terrain.read_text(encoding='utf-8')
          width_pattern = re.compile(r'''            const double CarveHalfWidth = FMath::Max\(\n                River\.Width \* 0\.5 \+ 100\.0,\n                River\.Width \* 0\.5 \+ River\.BankWidth\n            \);''')
          width = '''            // Erosion owns the valley shape. This final carve only guarantees\n            // clearance for the wetted channel and a small bank transition.\n            const double BankMargin = FMath::Min(\n                FMath::Max(75.0, River.Width * 0.12),\n                FMath::Max(0.0, River.BankWidth)\n            );\n            const double CarveHalfWidth = FMath::Max(\n                River.Width * 0.52,\n                River.Width * 0.5 + BankMargin\n            );'''
          t, count = width_pattern.subn(width, t, count=1)
          if count != 1:
              raise RuntimeError('Could not replace river carve width')

          depth_pattern = re.compile(r'''            const double BedZ = WaterZ - River\.Depth;\n            const float CarvedZ = static_cast<float>\(FMath::Lerp\(\n                BedZ,\n                static_cast<double>\(OutHeight\),\n                FMath::SmoothStep\(0\.0, 1\.0, CrossAlpha\)\n            \)\);''')
          depth = '''            const double ClearanceDepth = FMath::Min(\n                FMath::Max(60.0, River.Width * 0.10),\n                FMath::Max(60.0, River.Depth)\n            );\n            const double BedZ = WaterZ - ClearanceDepth;\n            const double BankBlend = FMath::SmoothStep(\n                0.0, 1.0, FMath::Pow(CrossAlpha, 0.72)\n            );\n            const float CarvedZ = static_cast<float>(FMath::Lerp(\n                BedZ,\n                static_cast<double>(OutHeight),\n                BankBlend\n            ));'''
          t, count = depth_pattern.subn(depth, t, count=1)
          if count != 1:
              raise RuntimeError('Could not replace river carve depth')
          terrain.write_text(t, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp AvenorClient/Source/Avenor/AvenorTerrainData.cpp
          git commit -m "Fix final terrain classification and river gouging"
          git push origin main
