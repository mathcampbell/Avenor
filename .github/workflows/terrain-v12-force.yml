name: Force terrain v12 balance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v12 terrain balance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s = p.read_text(encoding='utf-8')

          changes = [
              ('static constexpr int32 GeneratorAlgorithmVersion = 11;',
               'static constexpr int32 GeneratorAlgorithmVersion = 12;'),

              ('Warped, Scale * 2.8,\n        SeedOffset + FVector2D(1901.0, 331.0),',
               'Warped, Scale * 1.55,\n        SeedOffset + FVector2D(1901.0, 331.0),'),
              ('Warped, Scale * 2.1,\n        SeedOffset + FVector2D(433.0, 1777.0),',
               'Warped, Scale * 1.15,\n        SeedOffset + FVector2D(433.0, 1777.0),'),
              ('(Province * 0.70 + Province2 * 0.30 - 0.64) / 0.24',
               '(Province * 0.62 + Province2 * 0.38 - 0.56) / 0.30'),
              ('(Province * 0.46 + Province2 * 0.54 - 0.37) / 0.34',
               '(Province * 0.42 + Province2 * 0.58 - 0.30) / 0.46'),
              ('* (1.0 - MountainProvince * 0.72);',
               '* (1.0 - MountainProvince * 0.42);'),
              ('1.0 - MountainProvince * 0.90 - HillProvince * 0.58',
               '1.0 - MountainProvince * 0.70 - HillProvince * 0.46'),

              ('(BeltSignal - FMath::Lerp(0.54, 0.46, Activity)) / 0.34',
               '(BeltSignal - FMath::Lerp(0.50, 0.42, Activity)) / 0.40'),
              (')) * MountainProvince\n       * FMath::Lerp(0.58, 1.0, PositiveUplift);',
               ')) * FMath::Lerp(0.30, 1.0, MountainProvince)\n       * FMath::Lerp(0.62, 1.0, PositiveUplift);'),

              ('0.78\n            + (CrestRidges - 0.50) * 0.30\n            + (CrestVariation - 0.50) * 0.20,\n        0.62, 1.12',
               '0.82\n            + (CrestRidges - 0.50) * 0.22\n            + (CrestVariation - 0.50) * 0.16,\n        0.68, 1.04'),

              ('(0.48 * UplandRidges\n            + 0.34 * (0.5 + 0.5 * Rolling)\n            + 0.18 * Province2 - 0.42) / 0.34',
               '(0.40 * UplandRidges\n            + 0.40 * (0.5 + 0.5 * Rolling)\n            + 0.20 * Province2 - 0.33) / 0.46'),

              ('* FMath::Lerp(0.42, 0.72, Activity)',
               '* FMath::Lerp(0.36, 0.60, Activity)'),
              ('Height += FoothillEnvelope * Relief * 0.11\n        * (0.72 + UplandRidges * 0.28);',
               'Height += FoothillEnvelope * Relief * 0.14\n        * (0.74 + UplandRidges * 0.26);'),
              ('Height += IndependentHills * Relief * (\n        Rolling * 0.055\n        + (UplandRidges - 0.48) * 0.070\n        + HillDetail * 0.025\n    );',
               'Height += IndependentHills * Relief * (\n        0.050\n        + (0.5 + 0.5 * Rolling) * 0.052\n        + UplandRidges * 0.040\n        + HillDetail * 0.016\n    );'),
              ('PlainRoll * 0.018\n        + (PlainRidges - 0.46) * 0.012',
               'PlainRoll * 0.024\n        + (PlainRidges - 0.46) * 0.016'),
              ('static FGuid Version() { return FGuid(TEXT("0d67db9f-1539-4d60-8fba-269d8d459e61")); }',
               'static FGuid Version() { return FGuid(TEXT("5c84f5e8-8f3b-4ca6-a966-cb4ed9f1cb3b")); }'),
          ]

          applied = 0
          for old, new in changes:
              if old in s:
                  s = s.replace(old, new, 1)
                  applied += 1
              else:
                  print('WARNING missing target:', old[:90].replace('\n', ' '))

          if applied < 14:
              raise RuntimeError(f'Only {applied}/{len(changes)} terrain edits matched; refusing partial commit')

          p.write_text(s, encoding='utf-8')
          print(f'Applied {applied}/{len(changes)} terrain edits')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git commit -m "Balance terrain relief across plains hills and ranges"
          git push
