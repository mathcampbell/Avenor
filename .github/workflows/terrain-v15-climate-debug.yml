          # Replace the random-walk climate with broad deterministic regimes.
          climate_start = s.index('    const double Spacing = FMath::Max(\n        100000.0, Generator.ClimateRegionSpacing\n    );', s.index('static void BuildMacroClimate'))
          climate_end = s.index('    const FVector2D NoiseSeed(', climate_start)
          new_climate = '''    // RegionSpacing remains the fine transition/noise scale. Broad climate
    // provinces are deliberately larger so a 100 km strip contains several
    // recognisable climatic regions rather than dozens of narrow stripes.
    const double Spacing = FMath::Max(
        100000.0, Generator.ClimateRegionSpacing
    );
    const double ProvinceLength = FMath::Clamp(
        Spacing * 3.0, 1000000.0, 2200000.0
    );
    const int32 ProvinceCount = FMath::Max(
        2, FMath::CeilToInt(LongLength / ProvinceLength) + 1
    );

    // Climate wheel: neighbouring entries are plausible transitions, while a
    // complete long strip naturally samples cold/wet, temperate, tropical and
    // arid regimes. The user's baseline still pulls every target toward it.
    const TArray<FVector2D> ClimateWheel = {
        FVector2D(0.16, 0.30), // cold dry
        FVector2D(0.18, 0.76), // cold wet
        FVector2D(0.40, 0.76), // temperate wet
        FVector2D(0.62, 0.78), // warm wet
        FVector2D(0.84, 0.82), // hot wet
        FVector2D(0.86, 0.22), // hot dry
        FVector2D(0.64, 0.28), // warm dry
        FVector2D(0.40, 0.32)  // temperate dry
    };
    const FVector2D Baseline(
        Generator.ClimateTemperature,
        Generator.ClimateMoisture
    );
    int32 StartIndex = 0;
    double BestStartDistance = TNumericLimits<double>::Max();
    for (int32 Index = 0; Index < ClimateWheel.Num(); ++Index)
    {
        const double Distance = FVector2D::DistSquared(
            ClimateWheel[Index], Baseline
        );
        if (Distance < BestStartDistance)
        {
            BestStartDistance = Distance;
            StartIndex = Index;
        }
    }
    FRandomStream Random(Generator.Seed ^ 0x4a6f7921);
    const int32 Direction = Random.RandRange(0, 1) == 0 ? -1 : 1;
    const double Diversity = Generator.bShowcaseClimateCompression
        ? 1.0
        : FMath::Lerp(
            0.38, 0.82,
            FMath::Clamp(Generator.ClimateRegionalVariation, 0.0, 1.0)
        );
    TArray<double> TemperatureAnchors;
    TArray<double> MoistureAnchors;
    TemperatureAnchors.SetNumUninitialized(ProvinceCount);
    MoistureAnchors.SetNumUninitialized(ProvinceCount);
    for (int32 Index = 0; Index < ProvinceCount; ++Index)
    {
        const int32 WheelIndex = (
            StartIndex + Direction * Index + ClimateWheel.Num() * 8
        ) % ClimateWheel.Num();
        FVector2D Target = FMath::Lerp(
            Baseline, ClimateWheel[WheelIndex], Diversity
        );
        const double Jitter = Generator.ClimateRegionalVariation
            * (Generator.bShowcaseClimateCompression ? 0.045 : 0.025);
        Target.X += Random.FRandRange(-1.0f, 1.0f) * Jitter;
        Target.Y += Random.FRandRange(-1.0f, 1.0f) * Jitter;
        TemperatureAnchors[Index] = FMath::Clamp(Target.X, 0.03, 0.97);
        MoistureAnchors[Index] = FMath::Clamp(Target.Y, 0.03, 0.97);
    }

'''
