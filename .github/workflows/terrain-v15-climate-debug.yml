          # Need the terrain sample/cache definitions in this header.
          h = one(h,
          '#include "MeshPartitionModifierComponent.h"\n\n#include "AvenorStripTerrainGenerator.generated.h"',
          '#include "MeshPartitionModifierComponent.h"\n#include "AvenorTerrainData.h"\n\n#include "AvenorStripTerrainGenerator.generated.h"', 'terrain data include')

          # Chunk payload gains climate values and the final biome ID.
          s = one(s, 'static constexpr int32 ChunkPayloadVersion = 5;\nstatic constexpr int32 GeneratorAlgorithmVersion = 13;',
                  'static constexpr int32 ChunkPayloadVersion = 6;\nstatic constexpr int32 GeneratorAlgorithmVersion = 15;', 'generator versions')
          s = one(s,
          '''    auto WriteInt = [&](const TArray<int32>& Source)
    {
        ExtractIntChunk(Source, Data, StartX, StartY, CountX, CountY, IntValues);
        Archive << IntValues;
    };

    WriteFloat(Data.Height);''',
          '''    auto WriteInt = [&](const TArray<int32>& Source)
    {
        ExtractIntChunk(Source, Data, StartX, StartY, CountX, CountY, IntValues);
        Archive << IntValues;
    };
    auto WriteByte = [&](const TArray<uint8>& Source)
    {
        TArray<uint8> Values;
        Values.SetNumUninitialized(CountX * CountY);
        const bool bHasSource = Source.Num() == Data.Columns * Data.Rows;
        for (int32 LocalY = 0; LocalY < CountY; ++LocalY)
        {
            for (int32 LocalX = 0; LocalX < CountX; ++LocalX)
            {
                const int32 LocalIndex = LocalY * CountX + LocalX;
                const int32 SourceIndex = Data.Index(StartX + LocalX, StartY + LocalY);
                Values[LocalIndex] = bHasSource ? Source[SourceIndex] : 0;
            }
