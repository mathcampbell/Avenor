          # Climate changes how geology is expressed without dictating where geology exists.
          s = one(s,
          '''    const double MountainHeight = Smooth01(OutMountainMask);
    Height += MountainHeight * Relief
        * FMath::Lerp(0.54, 0.82, Activity)
        * CrestShape;''',
          '''    const double ClimateCold = bClimateEnabled
