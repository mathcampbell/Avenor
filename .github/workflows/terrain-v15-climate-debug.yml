    );
    Height += IndependentHills * Relief * (
        0.050
        + (0.5 + 0.5 * Rolling) * 0.052
        + UplandRidges * 0.040
        + HillDetail * 0.016
    ) * HillClimateExpression;''', 'climate hill expression')
          s = one(s,
          '''    Height -= RiftMask * Relief * FMath::Lerp(0.12, 0.30, RiftAmount)
        * FMath::Lerp(0.86, 1.08, RiftLine);''',
          '''    Height -= RiftMask * Relief * FMath::Lerp(0.12, 0.30, RiftAmount)
        * FMath::Lerp(0.86, 1.08, RiftLine)
        * FMath::Lerp(1.0, 1.14, ClimateArid);''', 'arid basins/rifts')
          s = one(s,
