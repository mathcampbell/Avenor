    );
    Height += OutPlainsMask * Relief * (
        PlainRoll * 0.024
        + (PlainRidges - 0.46) * 0.016
    ) * PlainClimateExpression;''', 'climate plains expression')

          # Data load needs climate arrays for camera sampling.
          s = one(s,
