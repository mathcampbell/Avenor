void AAvenorStripTerrainGenerator::Tick(float DeltaSeconds)
{
    Super::Tick(DeltaSeconds);
#if WITH_EDITOR
    if (!bShowCameraBiomeOverlay || !GEditor || !GetWorld())
    {
        return;
    }
    CameraProbeUpdateAccumulator += DeltaSeconds;
    if (CameraProbeUpdateAccumulator < 0.12)
    {
        return;
    }
    CameraProbeUpdateAccumulator = 0.0;

    FViewport* ActiveViewport = GEditor->GetActiveViewport();
    FEditorViewportClient* ViewportClient = ActiveViewport
        ? static_cast<FEditorViewportClient*>(ActiveViewport->GetClient())
        : nullptr;
    if (!ViewportClient)
    {
        return;
    }
    const FVector CameraLocation = ViewportClient->GetViewLocation();
    const FRotator CameraRotation = ViewportClient->GetViewRotation();
    const FVector2D CameraXY(CameraLocation.X, CameraLocation.Y);
    const UAvenorTerrainData* Asset = BakedTerrainData.LoadSynchronous();
    if (!Asset || !Asset->HasValidData())
    {
        CameraBiomeStatus = TEXT("Avenor biome probe: no valid baked terrain data");
        return;
    }
    if (CameraXY.X < Asset->WorldBounds.Min.X || CameraXY.X > Asset->WorldBounds.Max.X
        || CameraXY.Y < Asset->WorldBounds.Min.Y || CameraXY.Y > Asset->WorldBounds.Max.Y)
    {
        CameraBiomeStatus = FString::Printf(
            TEXT("Avenor biome probe | camera outside generated world | X %.2f km  Y %.2f km"),
            CameraLocation.X / 100000.0,
            CameraLocation.Y / 100000.0
        );
    }
    else
    {
        FAvenorTerrainSample Sample;
        if (Asset->SampleTerrain(CameraXY, Sample, CameraProbeChunkCache))
        {
            const EAvenorBiomeClass Biome = static_cast<EAvenorBiomeClass>(Sample.Biome);
            const UEnum* BiomeEnum = StaticEnum<EAvenorBiomeClass>();
            const FString BiomeName = BiomeEnum
                ? BiomeEnum->GetDisplayNameTextByValue(static_cast<int64>(Biome)).ToString()
                : TEXT("Unknown");
            const TCHAR* TerrainClass = Sample.Mountain >= 0.45f
                ? TEXT("Mountain")
                : (Sample.Hill >= 0.40f ? TEXT("Hills/Upland")
                : (Sample.Desert >= 0.45f ? TEXT("Arid terrain")
                : TEXT("Lowland/Plains")));
            CameraBiomeStatus = FString::Printf(
                TEXT("AVENOR BIOME PROBE\\nBiome: %s   Terrain: %s\\nRegional climate: T %.2f  M %.2f   Local: T %.2f  M %.2f\\nElevation: %.0f m   Flow: %.1f km2   X %.2f km  Y %.2f km"),
                *BiomeName,
                TerrainClass,
                Sample.MacroTemperature, Sample.MacroMoisture,
                Sample.Temperature, Sample.Moisture,
                Sample.Height / 100.0,
                Sample.Accumulation,
                CameraLocation.X / 100000.0,
                CameraLocation.Y / 100000.0
            );
        }
        else
        {
            CameraBiomeStatus = TEXT("Avenor biome probe: terrain sample unavailable");
        }
    }

    const FVector TextLocation = CameraLocation
        + CameraRotation.Vector() * 1400.0
        + FVector(0.0, 0.0, 260.0);
    DrawDebugString(
        GetWorld(), TextLocation, CameraBiomeStatus,
        nullptr, FColor::White, 0.16f, true, 1.15f
    );
#endif
}

