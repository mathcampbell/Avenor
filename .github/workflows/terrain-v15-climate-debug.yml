name: Apply terrain v15 climate provinces and biome probe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch climate, terrain expression and editor camera probe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cpp = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          hdr = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.h')
          data_h = Path('AvenorClient/Source/Avenor/AvenorTerrainData.h')
          data_cpp = Path('AvenorClient/Source/Avenor/AvenorTerrainData.cpp')
          s = cpp.read_text(encoding='utf-8')
          h = hdr.read_text(encoding='utf-8')
          dh = data_h.read_text(encoding='utf-8')
          dc = data_cpp.read_text(encoding='utf-8')

          def one(text, old, new, label):
              if old not in text:
                  if new in text:
                      print(label, 'already applied')
                      return text
                  raise RuntimeError(f'missing target: {label}')
              return text.replace(old, new, 1)

          # Remove the previous invalid header-level Oriented macro experiment.
          marker = '// The terrain implementation defines a local lambda named Oriented'
          if marker in h:
              h = h[:h.index(marker)].rstrip() + '\n'

          # Baked climate values are now first-class sample data for the editor probe.
          dh = one(dh, 'static constexpr int32 CurrentFormatVersion = 6;',
                   'static constexpr int32 CurrentFormatVersion = 7;', 'data format v7')
          dh = one(dh,
          '''struct AVENOR_API FAvenorTerrainSample
{
    float Height = 0.0f;
    float Slope = 0.0f;
    float Accumulation = 0.0f;
    float Mountain = 0.0f;
    float Hill = 0.0f;
    float Desert = 0.0f;
    float Plains = 0.0f;
};''',
          '''struct AVENOR_API FAvenorTerrainSample
{
    float Height = 0.0f;
    float Slope = 0.0f;
    float Accumulation = 0.0f;
    float Mountain = 0.0f;
    float Hill = 0.0f;
    float Desert = 0.0f;
    float Plains = 0.0f;
    float MacroTemperature = 0.5f;
    float MacroMoisture = 0.5f;
    float Temperature = 0.5f;
    float Moisture = 0.5f;
    uint8 Biome = static_cast<uint8>(EAvenorBiomeClass::TemperateMoist);
};''', 'terrain sample climate')
          dh = one(dh,
          '''    TArray<float> Accumulation;
    TArray<float> Slope;
};''',
          '''    TArray<float> Accumulation;
    TArray<float> Slope;
    TArray<float> MacroTemperature;
    TArray<float> MacroMoisture;
    TArray<float> Temperature;
    TArray<float> Moisture;
    TArray<uint8> Biome;
};''', 'sample chunk climate')

          # Add a lightweight live camera probe without adding a forest of settings.
          h = one(h,
          '''    AAvenorStripTerrainGenerator();

    UFUNCTION(CallInEditor, Category = "Avenor|Bake", meta = (DisplayName = "Generate and Bake Geography"))''',
          '''    AAvenorStripTerrainGenerator();
    virtual void Tick(float DeltaSeconds) override;
    virtual bool ShouldTickIfViewportsOnly() const override { return true; }

    UFUNCTION(CallInEditor, Category = "Avenor|Bake", meta = (DisplayName = "Generate and Bake Geography"))''', 'tick declarations')
          h = one(h,
          '''    UPROPERTY(VisibleAnywhere, Transient, Category = "Avenor|Status")
    bool bRefinementPlanReadyForWater = false;

    // Internal resolved constants.''',
          '''    UPROPERTY(VisibleAnywhere, Transient, Category = "Avenor|Status")
    bool bRefinementPlanReadyForWater = false;

    UPROPERTY(EditAnywhere, Category = "Avenor|Debug", meta = (ToolTip = "Shows the active editor camera position, regional climate, local climate, biome and terrain class directly in the level viewport."))
    bool bShowCameraBiomeOverlay = true;

    UPROPERTY(VisibleAnywhere, Transient, Category = "Avenor|Debug")
    FString CameraBiomeStatus;

    // Internal resolved constants.''', 'debug properties')
          h = one(h,
          '''    mutable TSharedPtr<const FAvenorStripData> CachedData;
    bool bDeferMeshRefresh = false;
    mutable bool bGeneratingGeography = false;
};''',
          '''    mutable TSharedPtr<const FAvenorStripData> CachedData;
    bool bDeferMeshRefresh = false;
    mutable bool bGeneratingGeography = false;
    double CameraProbeUpdateAccumulator = 0.0;
    FAvenorTerrainHeightChunkCache CameraProbeChunkCache;
