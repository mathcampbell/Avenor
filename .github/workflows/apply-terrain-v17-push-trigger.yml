name: Apply terrain v17 push trigger

on:
  push:
    branches: [main]
    paths: ['.terrain-v17-trigger']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply stored source patch
        shell: bash
        run: |
          awk '/python3 - <<'"'"'PY'"'"'/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/apply-terrain-v17-source.yml > /tmp/avenor_v17.py
          python3 /tmp/avenor_v17.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp AvenorClient/Source/Avenor/AvenorTerrainData.cpp
          git commit -m "Fix final landform classification and river gouging"
          git pull --rebase origin main
          git push origin main
