name: Scheduled one-shot terrain v14 application

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply terrain v14 and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'GeneratorAlgorithmVersion = 14;' AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp; then
            echo 'v14 already applied; cleaning temporary files only.'
          else
            awk '/python3 - <<'"'"'PY'"'"'/{flag=1;next} flag && /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/terrain-v14-rivers-probe.yml > /tmp/terrain_v14.py
            python3 /tmp/terrain_v14.py
          fi
          rm -f .github/workflows/terrain-v14-rivers-probe.yml \
                .github/workflows/terrain-v14-issue-runner.yml \
                .github/terrain-v14-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Keep rivers on thalwegs and diversify terrain relief'
          git push
