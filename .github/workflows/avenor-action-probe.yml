name: Avenor source action probe
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.issue.title == 'AVENOR ACTION PROBE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          echo ok > .avenor-action-probe-result
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .avenor-action-probe-result
          git commit -m "Confirm source action trigger"
          git push origin main
