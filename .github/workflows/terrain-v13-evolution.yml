name: Apply terrain v13 geomorphic evolution

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v13 terrain evolution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label, required=True):
              global s
              if old in s:
                  s = s.replace(old, new, 1)
                  print('applied:', label)
                  return True
              print('missing:', label)
              if required:
                  raise RuntimeError(label)
              return False

          one('static constexpr int32 GeneratorAlgorithmVersion = 12;',
              'static constexpr int32 GeneratorAlgorithmVersion = 13;', 'algorithm version')

          one('(BeltSignal - FMath::Lerp(0.50, 0.42, Activity)) / 0.40',
              '(BeltSignal - FMath::Lerp(0.44, 0.34, Activity)) / 0.38', 'range threshold')
          one(')) * FMath::Lerp(0.30, 1.0, MountainProvince)\n       * FMath::Lerp(0.62, 1.0, PositiveUplift);',
              ')) * FMath::Lerp(0.48, 1.0, MountainProvince)\n       * FMath::Lerp(0.70, 1.0, PositiveUplift);', 'range support')
          one('0.82\n            + (CrestRidges - 0.50) * 0.22\n            + (CrestVariation - 0.50) * 0.16,\n        0.68, 1.04',
              '0.88\n            + (CrestRidges - 0.50) * 0.16\n            + (CrestVariation - 0.50) * 0.12,\n        0.76, 1.03', 'crest clamp')
          one('* FMath::Lerp(0.36, 0.60, Activity)',
              '* FMath::Lerp(0.54, 0.82, Activity)', 'mountain height')
          one('Height += FoothillEnvelope * Relief * 0.14\n        * (0.74 + UplandRidges * 0.26);',
              'Height += FoothillEnvelope * Relief * 0.18\n        * (0.72 + UplandRidges * 0.28);', 'foothill height')

          start = s.find('    // Arid climate exposes and flattens resistant uplands into mesas and')
          end = s.find('    // Dunes remain low-amplitude regional terrain on quiet arid plains.', start)
          if start < 0 or end < 0:
              raise RuntimeError('stamped mesa block markers not found')
          replacement = '''    // Lithology is independent from shape. The later drainage/erosion loop
    // strips weak arid uplands while resistant caps survive, so mesas,
    // escarpments and canyon rims emerge instead of being height stamps.
    const double Lithology = 0.5 + 0.5 * Fbm(
        Warped, FMath::Max(90000.0, Scale * 0.22),
        SeedOffset + FVector2D(811.0, 397.0),
        4, 0.58, 2.0
    );
    const double ResistantCap = OutDesertMask
        * FMath::Clamp(OutHillMask + FoothillEnvelope * 0.45, 0.0, 1.0)
        * Smooth01(FMath::Clamp((Lithology - 0.48) / 0.38, 0.0, 1.0));

'''
          s = s[:start] + replacement + s[end:]
          one('const double DuneSuitability = OutDesertMask * OutPlainsMask\n        * (1.0 - PlateauMask * 0.90)',
              'const double DuneSuitability = OutDesertMask * OutPlainsMask\n        * (1.0 - ResistantCap * 0.85)', 'dune mesa dependency')
          one('''    OutResistance = FMath::Clamp(
        OutMountainMask * 0.28
            + OutHillMask * 0.11
            + OutDesertMask * (0.18 + PlateauMask * 0.38)
            + RiftShoulder * 0.10,
        0.0, 1.0
    );''', '''    OutResistance = FMath::Clamp(
        OutMountainMask * 0.24
            + OutHillMask * 0.09
            + OutDesertMask * 0.10
            + ResistantCap * 0.62
            + RiftShoulder * 0.10,
        0.0, 1.0
    );''', 'resistance model')

          marker = 'static int32 PrimaryReceiver(const FAvenorStripData& Data, int32 Cell)\n{'
          if 'static void EvolveTerrainFromDrainage(' not in s:
              if marker not in s:
                  raise RuntimeError('evolution insertion marker missing')
              evolution = r'''// Evolve structural terrain through the drainage network before final water
// features are selected. Weak terrain develops broad valleys; resistant arid
// uplands concentrate incision and survive as canyon rims and residual mesas.
static void EvolveTerrainFromDrainage(
    FAvenorStripData& Data,
    int32 Passes,
    double Strength,
    double MountainStartArea,
    double LowlandStartArea,
    double Epsilon,
    double ResistanceStrength
)
{
    if (Passes <= 0 || Strength <= 0.0 || Data.Height.Num() == 0)
    {
        return;
    }
    const bool bUseResistance = Data.Resistance.Num() == Data.Height.Num();
    const double EffectiveResistance = FMath::Clamp(ResistanceStrength, 0.0, 1.5);
    for (int32 Pass = 0; Pass < Passes; ++Pass)
    {
        PriorityFlood(Data, Epsilon);
        BuildContinuousFlow(Data);
        TArray<double> Delta;
        Delta.Init(0.0, Data.Height.Num());

        for (int32 Cell = 0; Cell < Data.Height.Num(); ++Cell)
        {
            const int32 X = Cell % Data.Columns;
            const int32 Y = Cell / Data.Columns;
            if (Data.IsBoundary(X, Y))
            {
                continue;
            }
            const double Mountain = Data.MountainMask.IsValidIndex(Cell) ? Data.MountainMask[Cell] : 0.0;
            const double Hill = Data.HillMask.IsValidIndex(Cell) ? Data.HillMask[Cell] : 0.0;
            const double Desert = Data.DesertMask.IsValidIndex(Cell) ? Data.DesertMask[Cell] : 0.0;
            const double Resistance = bUseResistance
                ? FMath::Clamp(Data.Resistance[Cell] * EffectiveResistance, 0.0, 0.94) : 0.0;
            const double ReliefClass = FMath::Clamp(FMath::Max(Mountain, Hill * 0.72), 0.0, 1.0);
            const double StartArea = FMath::Lerp(LowlandStartArea, MountainStartArea, ReliefClass)
                * DrainageSourceMultiplier(Data, Cell);
            const double AreaRatio = Data.Accumulation[Cell] / FMath::Max(0.01, StartArea);
            const double ChannelPower = Smooth01(FMath::Clamp(
                FMath::Loge(1.0 + FMath::Max(0.0, AreaRatio)) / FMath::Loge(9.0), 0.0, 1.0));
            const double Slope = FMath::Clamp(Data.Slope[Cell], 0.0, 0.8);

            // Differential weathering is what creates mesa remnants.
            const double Upland = FMath::Clamp(Hill + Mountain * 0.35, 0.0, 1.0);
            Delta[Cell] -= Desert * Upland * (1.0 - Resistance)
                * Strength * Data.CellSize * 0.006
                * (0.35 + FMath::Clamp(Slope / 0.10, 0.0, 1.0));

            if (ChannelPower <= 0.0 || Data.ReceiverA[Cell] == INDEX_NONE)
            {
                continue;
            }

            const double CanyonSuitability = Desert
                * Smooth01(FMath::Clamp((Resistance - 0.22) / 0.55, 0.0, 1.0))
                * FMath::Clamp(Hill + Mountain * 0.55, 0.0, 1.0);
            const double Incision = Strength * Data.CellSize
                * FMath::Lerp(0.035, 0.085, CanyonSuitability)
                * ChannelPower
                * (0.45 + FMath::Clamp(Slope / 0.09, 0.0, 1.0) * 0.55)
                * FMath::Lerp(1.0 - Resistance * 0.72, 0.78, CanyonSuitability);
            Delta[Cell] -= Incision;

            // Larger rivers in weak terrain widen their valleys; canyon rivers do not.
            const double BroadValley = ChannelPower * (1.0 - CanyonSuitability)
                * (1.0 - Resistance * 0.78);
            if (BroadValley > 0.02)
            {
                const int32 Radius = ChannelPower > 0.72 ? 3 : (ChannelPower > 0.42 ? 2 : 1);
                for (int32 DY = -Radius; DY <= Radius; ++DY)
                {
                    for (int32 DX = -Radius; DX <= Radius; ++DX)
                    {
                        if (DX == 0 && DY == 0) continue;
                        const int32 NX = X + DX;
                        const int32 NY = Y + DY;
                        if (!Data.IsValid(NX, NY) || Data.IsBoundary(NX, NY)) continue;
                        const double Distance = FMath::Sqrt(static_cast<double>(DX * DX + DY * DY));
                        if (Distance > static_cast<double>(Radius) + 0.15) continue;
                        const int32 Neighbor = Data.Index(NX, NY);
                        const double NeighborResistance = bUseResistance
                            ? FMath::Clamp(Data.Resistance[Neighbor] * EffectiveResistance, 0.0, 0.94) : 0.0;
                        const double Falloff = 1.0 - Distance / (static_cast<double>(Radius) + 0.75);
                        Delta[Neighbor] -= FMath::Max(0.0,
                            Incision * BroadValley * Falloff * (1.0 - NeighborResistance * 0.82) * 0.46);
                    }
                }
            }
        }

        const double MaximumPassChange = Data.CellSize * 0.12;
        for (int32 Cell = 0; Cell < Data.Height.Num(); ++Cell)
        {
            Data.Height[Cell] += FMath::Clamp(Delta[Cell], -MaximumPassChange, MaximumPassChange);
        }
    }
    PriorityFlood(Data, Epsilon);
    BuildContinuousFlow(Data);
}

'''
              s = s.replace(marker, evolution + marker, 1)
              print('inserted drainage evolution')

          old_call = '''    ApplyStreamPowerErosion(
        *Data, Generator.StreamPowerIterations, Generator.StreamPowerStrength,
        Generator.MountainStreamStartArea, Generator.LowlandStreamStartArea, Generator.DrainageEpsilon,
        Generator.ErosionResistanceStrength
    );

    TArray<bool> AuthoritativeRiverNetwork;'''
          new_call = '''    ApplyStreamPowerErosion(
        *Data, Generator.StreamPowerIterations, Generator.StreamPowerStrength,
        Generator.MountainStreamStartArea, Generator.LowlandStreamStartArea, Generator.DrainageEpsilon,
        Generator.ErosionResistanceStrength
    );

    EvolveTerrainFromDrainage(
        *Data,
        FMath::Clamp(Generator.StreamPowerIterations / 2 + 1, 2, 6),
        Generator.StreamPowerStrength,
        Generator.MountainStreamStartArea, Generator.LowlandStreamStartArea,
        Generator.DrainageEpsilon, Generator.ErosionResistanceStrength
    );
    ApplyThermalErosion(
        *Data,
        FMath::Clamp(Generator.ThermalErosionIterations / 3, 1, 4),
        Generator.ThermalErosionStrength * 0.32,
        Generator.TalusAngleDegrees, Generator.ErosionResistanceStrength
    );
    PriorityFlood(*Data, Generator.DrainageEpsilon);
    BuildContinuousFlow(*Data);

    TArray<bool> AuthoritativeRiverNetwork;'''
          one(old_call, new_call, 'generation evolution call')

          one('static FGuid Version() { return FGuid(TEXT("5c84f5e8-8f3b-4ca6-a966-cb4ed9f1cb3b")); }',
              'static FGuid Version() { return FGuid(TEXT("a4176c44-ff53-49b0-b453-f5e869d2c7c0")); }', 'DDC GUID')

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git commit -m "Evolve terrain through drainage and differential erosion"
          git push
