name: Apply river regression source patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'APPLY RIVER FIX NOW'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch source only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one('static constexpr int32 GeneratorAlgorithmVersion = 14;',
              'static constexpr int32 GeneratorAlgorithmVersion = 15;',
              'algorithm version')

          one('''        const int32 EndCell = CandidateReach.Cells.Last();\n        const double Area = Data.Accumulation[EndCell];\n        const double RiverAlpha = DrainageScaleAlpha(Area, MainRiverArea);\n        Points = ChaikinSmooth(Points, false, 1);\n        Points = ResamplePolyline(Points, Data.CellSize * 1.35, false);''',
'''        const int32 EndCell = CandidateReach.Cells.Last();\n        const double Area = Data.Accumulation[EndCell];\n        const double RiverAlpha = DrainageScaleAlpha(Area, MainRiverArea);\n        // The receiver graph is the authoritative XY route. Avoid smoothing\n        // steep reaches across valley walls; only gentler reaches get the\n        // normal first-pass curve treatment.\n        const int32 InitialSmoothIterations = MeanSlope > 0.035 ? 0 : 1;\n        Points = ChaikinSmooth(Points, false, InitialSmoothIterations);\n        Points = ResamplePolyline(Points, Data.CellSize * 1.35, false);''',
              'initial slope-aware smoothing')

          one('''        Points = ChaikinSmooth(Points, false, 2);\n        Points = ResamplePolyline(\n            Points,\n            FMath::Clamp(FeaturePointSpacing, 100.0, Data.CellSize),\n            false\n        );\n        ProjectRiverToLocalThalweg(Data, Points);''',
'''        const int32 FinalSmoothIterations = MeanSlope > 0.035\n            ? 0 : (MeanSlope > 0.018 ? 1 : 2);\n        Points = ChaikinSmooth(Points, false, FinalSmoothIterations);\n        Points = ResamplePolyline(\n            Points,\n            FMath::Clamp(FeaturePointSpacing, 100.0, Data.CellSize),\n            false\n        );\n        // Do not independently snap every resampled point sideways. That\n        // produced alternating choices across the valley and broken zig-zag\n        // Water Body splines. Meander constraints above remain responsible for\n        // keeping the visual route inside its hydrological corridor.''',
              'remove thalweg snap and tame final smoothing')

          one('''    HeadwaterValleyHalfWidth = FMath::Max(10000.0, WaterTerrain.RiverBankWidth);\n    MainValleyHalfWidth = FMath::Max(80000.0, WaterTerrain.RiverBankWidth * 3.0);''',
'''    // Broad valleys are created by erosion, not stamped by the active river.\n    // Keep ordinary final river carving close to the actual channel/banks.\n    // Canyon reaches can still deepen this later when geology/climate warrants it.\n    HeadwaterValleyHalfWidth = FMath::Max(2500.0, WaterTerrain.RiverBankWidth * 0.35);\n    MainValleyHalfWidth = FMath::Max(12000.0, WaterTerrain.RiverBankWidth * 1.25);''',
              'ordinary river carve width')

          one('''        River.ValleyHalfWidth = FMath::Lerp(HeadwaterValleyWidth, MainValleyWidth, RiverAlpha);\n        River.ValleyDepth = FMath::Lerp(River.Depth * 1.4, MaximumValleyDepth, RiverAlpha);''',
'''        River.ValleyHalfWidth = FMath::Lerp(HeadwaterValleyWidth, MainValleyWidth, RiverAlpha);\n        // The active channel should not excavate a second valley on top of the\n        // erosion pass. Ordinary reaches use modest bank/channel relief; canyon\n        // classification below is the only path to major cliff-sided incision.\n        River.ValleyDepth = FMath::Lerp(\n            River.Depth * 0.45,\n            FMath::Min(MaximumValleyDepth * 0.24, River.Depth * 0.90),\n            RiverAlpha\n        );''',
              'ordinary river carve depth')

          one('static FGuid Version() { return FGuid(TEXT("b96f4c24-6fb4-49c2-9e1e-7b43ef405e14")); }',
              'static FGuid Version() { return FGuid(TEXT("5e0174a3-4ad9-4bb1-9f8e-71e5079ce9c2")); }',
              'modifier guid')

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AvenorClient/Source/AvenorEditor/AvenorStripTerrainGenerator.cpp
          git rm -f .github/workflows/apply-river-fix.yml .river-fix-trigger
          git commit -m "Fix river spline regression and excessive channel carving"
          git push origin main
